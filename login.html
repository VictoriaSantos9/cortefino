<!doctype html>
<html lang="pt-PT">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login | Corte Fino</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
	<style>
		:root {
			--paper: #f6f4ef;
			--ink: #171a16;
			--muted: #72766e;
			--line: #d9d9d1;
			--green: #b8d66a;
			--green-dark: #354827;
			--coral: #dc7055;
			--white: #fffefa;
			--serif: "Playfair Display", Georgia, serif;
			--sans: "DM Sans", "Segoe UI", sans-serif;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: var(--sans);
			background: linear-gradient(135deg, #f7f3eb 0%, #ece3d7 100%);
			color: var(--ink);
		}
		a { color: inherit; text-decoration: none; }
		button, input { font: inherit; }
		.site-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 18px 6.2%;
			border-bottom: 1px solid var(--line);
			background: rgba(246, 244, 239, 0.9);
		}
		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			font-size: 17px;
			font-weight: 700;
		}
		.brand-mark {
			width: 30px;
			height: 30px;
			display: grid;
			place-items: center;
			border-radius: 50%;
			background: var(--green);
			font-family: var(--serif);
		}
		.nav-links {
			display: flex;
			gap: 22px;
			color: #4d544d;
			font-size: 13px;
		}
		.header-actions { display: flex; gap: 10px; }
		.button {
			min-height: 42px;
			padding: 0 18px;
			border: 1px solid var(--ink);
			background: transparent;
			cursor: pointer;
			font-size: 12px;
			font-weight: 600;
		}
		.button-dark {
			background: var(--ink);
			border-color: var(--ink);
			color: var(--white);
		}
		.login-shell {
			display: grid;
			place-items: center;
			min-height: calc(100vh - 78px);
			padding: 48px 20px;
		}
		.login-card {
			display: grid;
			grid-template-columns: 1.05fr .95fr;
			width: min(940px, 100%);
			background: rgba(255,255,255,0.7);
			border: 1px solid var(--line);
			box-shadow: 0 18px 45px rgba(0,0,0,0.08);
		}
		.login-visual {
			padding: 40px 30px;
			background: linear-gradient(135deg, rgba(184,214,106,.25), rgba(220,112,85,.12));
			border-right: 1px solid var(--line);
			display: flex;
			flex-direction: column;
			justify-content: center;
		}
		.eyebrow {
			display: flex;
			align-items: center;
			gap: 10px;
			margin: 0 0 14px;
			color: var(--green-dark);
			font-size: 10px;
			font-weight: 700;
			letter-spacing: 1.5px;
			text-transform: uppercase;
		}
		.eyebrow::before {
			content: "";
			width: 28px;
			height: 1px;
			background: var(--coral);
		}
		h1 {
			margin: 0 0 14px;
			font-family: var(--serif);
			font-size: clamp(42px, 5vw, 66px);
			font-weight: 500;
			line-height: 1.02;
		}
		.login-visual p {
			margin: 0;
			color: var(--muted);
			line-height: 1.7;
			font-size: 14px;
		}
		.login-form-wrap {
			padding: 40px 32px;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.login-form {
			width: min(360px, 100%);
			display: grid;
			gap: 16px;
		}
		.login-form label {
			display: grid;
			gap: 8px;
			font-size: 11px;
			font-weight: 700;
		}
		.login-form input {
			width: 100%;
			height: 44px;
			padding: 0 42px 0 13px;
			border: 1px solid var(--line);
			background: var(--white);
			font-size: 13px;
		}
		.password-field { position: relative; }
		.password-field .toggle-password {
			position: absolute;
			right: 10px;
			top: 50%;
			transform: translateY(-50%);
			width: 28px;
			height: 28px;
			border: 0;
			background: transparent;
			cursor: pointer;
			font-size: 15px;
			color: var(--muted);
		}
		.inline-link {
			display: inline-flex;
			justify-content: flex-end;
			color: var(--green-dark);
			font-size: 11px;
			font-weight: 600;
		}
		.account-note {
			margin: 0;
			color: var(--muted);
			font-size: 11px;
			text-align: center;
		}
		.account-note a { color: var(--ink); font-weight: 700; }
		@media (max-width: 760px) {
			.login-card { grid-template-columns: 1fr; }
			.login-visual { border-right: 0; border-bottom: 1px solid var(--line); }
			.nav-links { display: none; }
		}
	</style>
</head>
<body>
	<header class="site-header">
		<a class="brand" href="index.html"><span class="brand-mark">c.</span> corte fino</a>
		<nav class="nav-links" aria-label="Navegação principal">
			<a href="index.html">Início</a>
			<a href="cortes.html">Cortes</a>
			<a href="sobre.html">Sobre</a>
		</nav>
		<div class="header-actions">
			<a class="button button-dark" href="registo.html">Criar conta</a>
		</div>
	</header>

	<main class="login-shell">
		<section class="login-card">
			<div class="login-visual">
				<p class="eyebrow">A sua próxima assinatura</p>
				<h1>Entrar<br>na sua conta</h1>
				<p>Veja os cortes ideais para si, guarde favoritos e descubra recomendações personalizadas com base no seu perfil.</p>
			</div>

			<div class="login-form-wrap">
				<form class="login-form" action="index.html">
					<label for="loginEmail">Email</label>
					<input id="loginEmail" type="email" placeholder="nome@email.com" required>

					<label for="loginPassword">Palavra-passe</label>
					<div class="password-field">
						<input id="loginPassword" type="password" placeholder="Introduza a sua palavra-passe" required>
						<button type="button" class="toggle-password" data-target="loginPassword" aria-label="Mostrar palavra-passe">👁</button>
					</div>

					<a class="inline-link" href="registo.html">Esqueci-me da palavra-passe</a>
					<button class="button button-dark" type="submit">Entrar</button>
					<p class="account-note">Ainda não tens conta? <a href="registo.html">Regista-te</a></p>
				</form>
			</div>
		</section>
	</main>

	<script>
		document.querySelectorAll('.toggle-password').forEach(button => {
			button.addEventListener('click', () => {
				const input = document.getElementById(button.dataset.target);
				if (!input) return;
				const showPassword = input.type === 'password';
				input.type = showPassword ? 'text' : 'password';
				button.textContent = showPassword ? '🙈' : '👁';
				button.setAttribute('aria-label', showPassword ? 'Ocultar palavra-passe' : 'Mostrar palavra-passe');
			});
		});
	</script>
</body>
</html>
